<input type=file id=f><button onclick=v()>VERIFICAR</button><p id=r></p><script>async function v(){const f=document.getElementById("f").files[0];const b=await f.arrayBuffer();const h=await crypto.subtle.digest("SHA-256",b);const s=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");document.getElementById("r").innerHTML="Hash:<br>"+s}</script>
