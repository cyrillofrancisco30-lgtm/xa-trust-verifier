name: verify

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest test_api_client_executor.py -v
      - run: python verify_automation.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence.json
