name: XA Finance - Verify Loop
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install cryptography rfc8785 pytest
      - name: Run deterministic loop
        run: |
          python3 verify_independent.py claim.json
          python3 -m pytest -q
          echo "REPLAY_OK"
