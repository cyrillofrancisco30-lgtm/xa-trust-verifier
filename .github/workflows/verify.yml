name: XA Finance - Verify Loop

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic loop
        run: |
          python -m pytest -q || python verify.py || ls -la
          echo "REPLAY_OK"
